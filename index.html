<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YUSHA YUKIO</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Teko:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --burgundy: #7a1528;
            --light-bg: #f5f5f5;
            --text-dark: #1a1a1a;
            --text-light: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--light-bg);
            overflow: hidden;
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        /* --- ANIMATIONS --- */
        @keyframes bgExpand {
            0% { clip-path: polygon(100% 0, 100% 0, 75% 100%, 75% 100%); }
            100% { clip-path: polygon(0 0, 100% 0, 75% 100%, 0% 100%); }
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeUpCenter {
            0% { opacity: 0; transform: translate(-50%, 40px); }
            100% { opacity: 1; transform: translate(-50%, 0); }
        }

        @keyframes fadeDown {
            0% { opacity: 0; transform: translateY(-30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeRight {
            0% { opacity: 0; transform: translateX(40px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        @keyframes charReveal {
            0% { opacity: 0; transform: translateX(-50%) translateY(10vh) scale(0.95); filter: blur(10px); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); filter: blur(0); }
        }

        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes bubbleShake {
            0% { opacity: 0; transform: scale(0.3) rotate(-15deg); }
            40% { opacity: 1; transform: scale(1.1) rotate(5deg); }
            60% { transform: scale(0.95) rotate(-3deg); }
            80% { transform: scale(1.02) rotate(2deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        /* Split Background */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            display: flex;
        }

        .bg-burgundy {
            background-color: var(--burgundy);
            width: 65%;
            height: 100%;
            /* Start invisible and animate to full shape */
            clip-path: polygon(100% 0, 100% 0, 75% 100%, 75% 100%);
            animation: bgExpand 1.5s cubic-bezier(0.85, 0, 0.15, 1) forwards;
        }

        .bg-light {
            background-color: var(--light-bg);
            width: 100%;
            height: 100%;
            position: absolute;
            z-index: -2;
        }

        /* Layout */
        .container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            height: 100vh;
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
        }

        /* Navigation */
        nav {
            position: absolute;
            top: 3rem;
            left: 4rem;
            display: flex;
            gap: 2rem;
            z-index: 10;
        }

        nav a {
            color: var(--text-dark);
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            position: relative;
            opacity: 0;
            animation: fadeDown 0.8s ease-out forwards;
        }
        
        nav a:nth-child(1) { animation-delay: 1.2s; }
        nav a:nth-child(2) { animation-delay: 1.3s; }
        nav a:nth-child(3) { animation-delay: 1.4s; }

        nav a:hover {
            color: var(--burgundy);
            transition: color 0.3s;
        }

        /* Big Text Left */
        .main-title {
            position: absolute;
            top: 50%;
            left: 2rem;
            transform: translateY(-50%);
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 10rem;
            line-height: 0.85;
            text-transform: uppercase;
            color: var(--text-dark);
            z-index: 1; /* Behind character */
            display: flex;
            flex-direction: column;
            white-space: nowrap;
        }

        .main-title span {
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .main-title span:nth-child(1) { animation-delay: 0.5s; }
        .main-title span:nth-child(2) {
             font-size: 7.5rem;
             animation-delay: 0.7s;
        }

        /* Start Watch Button */
        .start-btn {
            position: absolute;
            top: calc(50% + 9rem);
            left: 4rem;
            background-color: var(--light-bg);
            color: var(--text-dark);
            padding: 1rem 2rem;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 10;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            animation-delay: 1.5s;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
        }

        .start-btn:hover {
            transform: scale(1.05);
            background-color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Character Image */
        .character-img {
            position: absolute;
            bottom: -35vh;
            left: 50%;
            transform: translateX(-50%);
            height: 135vh;
            z-index: 5;
            object-fit: contain;
            pointer-events: none;
            opacity: 0;
            animation: charReveal 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.8s;
        }

        /* Comic Speech Bubble */
        .speech-bubble {
            position: absolute;
            top: 10%;
            left: calc(50% - 380px);
            width: 320px;
            background: #fff;
            border: 3px solid #1a1a1a;
            padding: 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            line-height: 1.5;
            color: #1a1a1a;
            z-index: 6;
            opacity: 0;
            transform-origin: bottom right; 
            animation: bubbleShake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
            animation-delay: 2.2s; 
        }

        .speech-bubble::after, .speech-bubble::before {
            content: '';
            position: absolute;
            top: 20%; /* Moved from 50% to point higher (at the head) */
            transform: translateY(-50%);
            border-style: solid;
        }

        /* Outer border of the tail */
        .speech-bubble::after {
            right: -23px;
            border-width: 15px 0 15px 20px;
            border-color: transparent transparent transparent #1a1a1a;
            z-index: 1;
            /* Slant it slightly upwards */
            transform: translateY(-50%) rotate(-15deg); 
        }

        /* Inner white part of the tail */
        .speech-bubble::before {
            right: -17px;
            border-width: 12px 0 12px 18px;
            border-color: transparent transparent transparent #fff;
            z-index: 2;
            /* Slant it slightly upwards */
            transform: translateY(-50%) rotate(-15deg); 
        }

        /* Right Content */
        .right-content {
            position: absolute;
            top: 3rem;
            right: 4rem;
            text-align: right;
            width: 400px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .char-name {
            font-family: 'Teko', sans-serif;
            font-weight: 700;
            font-size: 6rem;
            line-height: 0.8;
            text-transform: uppercase;
            color: var(--text-dark);
            margin-bottom: 6rem;
            letter-spacing: 2px;
            opacity: 0;
            animation: fadeRight 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            animation-delay: 1.1s;
        }

        .about-section {
            text-align: left;
            width: 320px;
            margin-top: auto;
            position: absolute;
            top: 38vh;
            right: 0;
        }

        .about-title {
            font-weight: 900;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0;
            animation: fadeRight 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            animation-delay: 1.3s;
        }

        .about-text {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #444;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background-color: var(--text-dark);
            vertical-align: middle;
            animation: cursorBlink 0.8s infinite;
        }

        /* Tablets */
        @media (max-width: 1200px) {
            .main-title { font-size: 5rem; }
            .main-title span:last-child { font-size: 3.5rem; }
            .char-name { font-size: 5rem; }
            .character-img { height: 85vh; transform: translateX(-50%); }
            .speech-bubble { left: calc(50% - 300px); width: 250px; }
        }

        /* Mobile Devices (Proper App-like Layout) */
        @media (max-width: 768px) {
            body { 
                overflow-y: auto; 
                overflow-x: hidden; 
            }
            
            .container {
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 1rem;
                height: auto;
                min-height: 100vh;
                padding-bottom: 6rem; /* Space for the sticky button */
            }

            /* Modify Background Animation */
            .bg-burgundy {
                width: 100%;
                height: 55vh;
                animation: bgExpandMobile 1.2s cubic-bezier(0.85, 0, 0.15, 1) forwards;
            }
            
            @keyframes bgExpandMobile {
                0% { clip-path: polygon(0 0, 100% 0, 100% 0, 0 0); }
                100% { clip-path: polygon(0 0, 100% 0, 100% 75%, 0% 100%); }
            }

            /* Navbar */
            nav {
                position: relative;
                top: 0; left: 0;
                width: 100%;
                justify-content: center;
                gap: 1.2rem;
                margin-top: 1rem;
                margin-bottom: 2rem;
            }
            nav a { font-size: 0.85rem; }

            /* Main Title */
            .main-title {
                position: relative;
                top: 0; left: 0;
                transform: none;
                width: 100%;
                text-align: center;
                font-size: 4rem;
                z-index: 2;
                margin-bottom: 2rem;
            }
            .main-title span:last-child { font-size: 2.8rem; }

            /* Character */
            .character-img {
                position: relative;
                bottom: auto; left: auto;
                transform: none;
                height: auto;
                width: 125%;
                max-width: 450px;
                margin-top: -3rem;
                margin-bottom: 1rem;
                z-index: 5;
                animation: charRevealMobile 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
                animation-delay: 0.8s;
            }
            
            @keyframes charRevealMobile {
                0% { opacity: 0; transform: translateY(5vh); filter: blur(5px); }
                100% { opacity: 1; transform: translateY(0); filter: blur(0); }
            }

            /* Speech Bubble */
            .speech-bubble {
                top: 12vh; /* Moved up significantly to be next to head */
                left: 1rem;
                width: 200px;
                padding: 12px;
                font-size: 0.75rem;
                z-index: 6;
                animation: bubbleShakeMobile 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
                animation-delay: 2.2s; 
            }
            /* Position tail at the top-right of the bubble to point exactly at the head */
            .speech-bubble::after, .speech-bubble::before {
                top: 20%;
                transform: translateY(-50%) rotate(-15deg);
            }
            .speech-bubble::after { right: -15px; border-width: 10px 0 10px 15px; }
            .speech-bubble::before { right: -11px; border-width: 8px 0 8px 11px; }
            
            @keyframes bubbleShakeMobile {
                0% { opacity: 0; transform: scale(0.3) rotate(-10deg); }
                40% { opacity: 1; transform: scale(1.1) rotate(5deg); }
                60% { transform: scale(0.95) rotate(-3deg); }
                80% { transform: scale(1.02) rotate(2deg); }
                100% { opacity: 1; transform: scale(1) rotate(0deg); }
            }

            /* Right Content - Char Name and About */
            .right-content {
                position: relative;
                top: auto; right: auto;
                width: 100%;
                text-align: center;
                align-items: center;
                padding: 0;
                margin-top: -3rem; /* overlap slightly */
            }

            .char-name {
                font-size: 4rem;
                margin-bottom: 1.5rem;
                text-shadow: 2px 2px 0px rgba(255,255,255,0.8); /* visibility */
                z-index: 6;
            }

            .about-section {
                position: relative;
                top: auto; right: auto;
                width: 100%;
                text-align: center;
                margin-bottom: 1rem;
                z-index: 10;
            }
            .about-text {
                background: rgba(255, 255, 255, 0.85); /* Readability on mixed background */
                padding: 15px;
                border-radius: 8px;
                box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            }

            /* Server Button - Sticky Bottom */
            .start-btn {
                position: fixed;
                bottom: 1.5rem;
                left: 50%;
                top: auto;
                width: 90%;
                max-width: 350px;
                justify-content: center;
                box-shadow: 0 4px 15px rgba(0,0,0,0.3);
                z-index: 20;
                /* Overwrite animation to prevent conflict with absolute centering */
                animation: fadeUpCenterBtn 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
                animation-delay: 1.5s;
            }
            
            @keyframes fadeUpCenterBtn {
                0% { opacity: 0; transform: translate(-50%, 40px); }
                100% { opacity: 1; transform: translate(-50%, 0); }
            }
            
            .start-btn:hover {
                transform: translate(-50%, -2px);
                box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            }
        }
    </style>
</head>
<body>
    <div class="background-container">
        <div class="bg-light"></div>
        <div class="bg-burgundy"></div>
    </div>

    <div class="container">
        <nav>
            <a href="https://t.me/yusshahryssha" target="_blank">TELEGRAM</a>
            <a href="https://www.twitch.tv/yusshhaa" target="_blank">TWITCH</a>
            <a href="https://steamcommunity.com/profiles/76561198844388575/" target="_blank">STEAM</a>
        </nav>

        <div class="main-title">
            <span>YUSHA</span>
            <span>勇者ユキオ</span>
        </div>

        <a href="https://discord.com/invite/bdJ3u6cxRQ" target="_blank" class="start-btn">SERVER</a>

        <img src="hero2.png" alt="Yukio" class="character-img">

        <div class="speech-bubble">
            <span id="bubble-text"></span>
        </div>

        <div class="right-content">
            <h1 class="char-name">YUKIO</h1>
            
            <div class="about-section">
                <div class="about-title">About</div>
                <p class="about-text" id="typewriter-text" data-text="Со временем привыкаешь к тишине. Она становится честнее любого разговора. В ней нет обещаний, нет оправданий и нет необходимости делать вид, что всё закончится хорошо. Остаётся только ночь, медленно стекающая по окнам, и собственные мысли, от которых уже не спрятаться ни за шумом чужих голосов, ни за светом города."></p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // About text setup
            const textElement = document.getElementById('typewriter-text');
            const fullText = textElement.getAttribute('data-text');
            textElement.textContent = '';
            
            const mainCursor = document.createElement('span');
            mainCursor.className = 'cursor';
            
            // Bubble text setup
            const bubbleTexts = [
                "«Пожалуй, самое приятное — когда ничего не происходит, но почему-то именно в такие моменты понимаешь, что всё на самом деле хорошо.»",
                "«Я не знаю, каким будет завтра, и, если честно, не хочу знать заранее. В этом ведь и есть смысл — иногда позволить жизни самой придумать продолжение.»"
            ];
            const bubbleElement = document.getElementById('bubble-text');
            const selectedBubbleText = bubbleTexts[Math.floor(Math.random() * bubbleTexts.length)];
            
            const bubbleCursor = document.createElement('span');
            bubbleCursor.className = 'cursor';
            
            // About text typing
            setTimeout(() => {
                textElement.appendChild(mainCursor);
                
                let i = 0;
                const typingInterval = setInterval(() => {
                    const charNode = document.createTextNode(fullText.charAt(i));
                    textElement.insertBefore(charNode, mainCursor);
                    i++;
                    
                    if (i >= fullText.length) {
                        clearInterval(typingInterval);
                        setTimeout(() => mainCursor.remove(), 4000); 
                    }
                }, 30);
            }, 1800);

            // Bubble text typing
            setTimeout(() => {
                bubbleElement.appendChild(bubbleCursor);
                
                let j = 0;
                const bubbleInterval = setInterval(() => {
                    const charNode = document.createTextNode(selectedBubbleText.charAt(j));
                    bubbleElement.insertBefore(charNode, bubbleCursor);
                    j++;
                    
                    if (j >= selectedBubbleText.length) {
                        clearInterval(bubbleInterval);
                        setTimeout(() => bubbleCursor.remove(), 4000); 
                    }
                }, 30);
            }, 2600); // Wait for the bubble pop animation to almost finish
        });
    </script>
</body>
</html>
